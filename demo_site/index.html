<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chromecast Radio</title>

    <!-- mozno zbavit sa tychto kniznic (Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>

    <!-- Google Inter font import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="indexStyle.css" type="text/css">
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="'favicon-16x16.png">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="indexScript.js" type="text/javascript"></script>
</head>

<body>
    <div id="cover"></div>
    <!--
        <button onclick="connect()">connect</button>
        <button onclick="disconnect()">disconnect</button>
        <button onclick="stop()">stop</button>
    -->
    <div class="textContainer">
        <p id="statusText" , class="text"></p>
    </div>
    <div class="textContainer">
        <p id="vybrana" , class="text"></p>
    </div>
    <table cellpadding="0" cellspacing="0" , id="mainTable">
        <tr>
            <td>
                <button onclick="zapnut()" id="buttonOn" class="button">ON</button>
            </td>
            <td rowspan="2">
                <div id="staniceContainer">
                    <div class="list-group" id="stanice"></div>
                </div>
            </td>
        </tr>
        <tr>
            <td> <button onclick="vypnut()" id="buttonOff" class="button">OFF</button></td>
        </tr>
        <tr>
            <td colspan="2">
                <div class="slidecontainer">
                    <p id="volume">-</p>
                    <input oninput="sliderInput();" onchange="sliderChange();" type="range" min="0" max="100" value="50"
                        class="slider" id="volumeController">
                </div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <div class="btn-group btn-group-separators flex-wrap" id="chromecasts" role="group" aria-label="Basic radio toggle button group">
                    <!-- <input value="friendlyName" type="radio" class="selectButton btn-check" name="selectChromecast" id="optioni" autocomplete="off" checked="checked">
                    <label class="btn btn-default chromecastSelect" for="optioni">DisplayName</label> -->
                </div>
            </td>
        </tr>

    </table>
</body>

</html>
